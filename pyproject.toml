[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chemreg-intel"
version = "0.1.0"
description = "Local-first chemical regulatory evidence screening workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.37",
  "pandas>=2.0",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
chemreg-datasets = "chemreg_intel.regulatory.cli:main"

[tool.setuptools.packages.find]
include = ["chemreg_intel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
